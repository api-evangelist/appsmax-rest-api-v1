notes: >-
  Both hosts answer 404 with an HTML page for unknown /.well-known/ paths, so no SPA
  catch-all false positive is possible here. The one real well-known document is the API
  Onboarding Descriptor — AppsMax self-declares maturity "console-only": an account and an
  organization are required, REST access is gated to the paid Profi plan, and token issuance
  requires a signed-in human in the cabinet. There is no OAuth/OIDC discovery surface because
  the API does not run OAuth. There is no /.well-known/api-catalog; the equivalent index is
  published at the non-well-known path https://appsmax.ru/apis.json.

gaps_declared_by_provider:
  - API token creation, scope selection and revocation require a signed-in human using the AppsMax cabinet.
  - No management API, dynamic client registration endpoint or machine onboarding flow for issuing API tokens.
  - REST API access requires the Profi plan or an individual access right.

