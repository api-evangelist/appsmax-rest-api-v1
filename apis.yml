apis:
  - aid: appsmax.ru:rest-api-v1
    name: AppsMax REST API v1
    description: >-
      Server-to-server API for managing AppsMax organizations, bots, connections, mini apps, funnels, interactive menus,
      customer requests, campaigns and subscribers. 17 paths and 21 operations across the Access, Organizations, Bots,
      Miniapps, Funnels, Interactive menu, Applications, Campaigns and Subscribers tags. Authenticated with an
      organization-owned API token, sent as an Authorization Bearer header or an X-Api-Token fallback header, with
      scope-based access. This is the AppsMax platform API, not an official API of MAX or Telegram.
