aid: appsmax.ru:api-catalog
name: AppsMax
description: >-
  AppsMax.ru is a Russian-language SaaS platform for small business, communities and integrators, used to run customer
  requests, online booking, orders, mini apps, groups, channels, permitted messaging, GigaChat and integrations inside
  MAX and Telegram. Its developer surface is a single server-to-server REST API (v1) with a published OpenAPI 3.0.3
  contract, an APIs.json index, an API Onboarding Descriptor and an llms.txt. AppsMax is not a product of, nor an
  official representative of, MAX, Telegram or GigaChat.
