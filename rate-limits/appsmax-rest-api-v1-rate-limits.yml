specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: AppsMax
providerId: appsmax-rest-api-v1
generated: '2026-08-09'
method: searched
created: '2026-08-09'
modified: '2026-08-09'
sources:
  - https://appsmax.ru/developers/#errors
  - https://appsmax.ru/developers/openapi.json
tags:
  - Rate Limiting
  - Messaging
  - Chatbots
description: >-
  AppsMax enforces a default limit of 60 requests per minute per API token. An administrator
  may set a different limit for a specific token; the effective value is readable at GET /me
  and echoed on responses in X-RateLimit-Limit / X-RateLimit-Remaining. Campaign creation and
  campaign launch carry additional, tighter operation-level limits on top of the token limit.
  The default is asserted machine-readably in the OpenAPI as
  x-appsmax-default-rate-limit-per-minute.
headers:
  requestId: X-Request-Id
  limit: X-RateLimit-Limit
  remaining: X-RateLimit-Remaining
  retryAfter: Retry-After
  apiVersion: X-Api-Version
responseCodes:
  throttled: 429
limits:
  - name: Default per-token limit
    scope: token
    metric: requests_per_minute
    limit: 60
    timeFrame: minute
    source: 'openapi x-appsmax-default-rate-limit-per-minute: 60'
  - name: Campaign creation
    scope: operation
    operationId: createCampaign
    metric: requests_per_minute
    limit: null
    timeFrame: minute
    note: >-
      An additional limit applies on top of the token limit. The provider documents its
      existence but does not publish the number.
  - name: Campaign launch
    scope: operation
    operationId: runCampaign
    metric: requests_per_minute
    limit: null
    timeFrame: minute
    note: >-
      An additional limit applies on top of the token limit. The provider documents its
      existence but does not publish the number.
overrides:
  per_token: true
  mechanism: An administrator can set a different limit for an individual token.
  discovery: 'GET /me returns the token''s effective rate_limit.'
backoff_guidance: >-
  On 429, pause and use exponential backoff, honouring Retry-After. Do not increase burst.
gaps:
  - The numeric campaign-specific limits are not published.
  - No RateLimit-Reset header and no IETF RateLimit-* fields; only the legacy X-RateLimit-* pair.
x-evidence:
  fetched: '2026-08-09'
  urls:
    - url: https://appsmax.ru/developers/
      http_status: 200
    - url: https://appsmax.ru/developers/openapi.json
      http_status: 200
